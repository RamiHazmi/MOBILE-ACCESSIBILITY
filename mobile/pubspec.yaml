name: voice_assistant
version: 1.0.0
description: WExist
publish_to: 'none'
environment:
  sdk: ">=3.0.0 <4.0.0"
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  http: ^1.6.0
  record: ^6.2.0
  path_provider: ^2.1.5
  camera: ^0.10.0
  flutter_tts: ^3.8.0
  vibration: ^3.1.8
  geolocator: ^10.1.0
  # ── OpenStreetMap tile map (free, no API key) ──────────────
  flutter_map: ^6.1.0
  latlong2: ^0.9.0
  web_socket_channel: ^2.4.0
  image_picker: ^1.0.7
  image: ^4.2.0
  shared_preferences: ^2.2.2
  uuid: ^4.3.3
  local_auth: ^2.3.0
  url_launcher: ^6.3.0
  video_player: ^2.9.2

dev_dependencies:
  flutter_launcher_icons: ^0.13.1

flutter_icons:
  android: true
  ios: false
  image_path: "assets/logo.jpeg"
  adaptive_icon_background: "#ffffff"
  adaptive_icon_foreground: "assets/logo.jpeg"
